name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # The API suite runs against a real PostgreSQL — transactional business
    # rules (e.g. never selling the same IMEI twice) cannot be verified
    # against a mock.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: phoneerp
          POSTGRES_PASSWORD: devpass
          POSTGRES_DB: phoneerp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U phoneerp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Overrides the scratch database in .env.test.example; setup-env.ts only
      # fills variables that are not already set in the environment.
      DATABASE_URL: postgresql://phoneerp:devpass@localhost:5432/phoneerp_test?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate -w @phone-erp/api

      - name: Apply schema to the test database
        run: npm run db:deploy -w @phone-erp/api

      - name: Lint
        run: npm run lint

      - name: Translation parity (web)
        run: npm run check:i18n -w @phone-erp/web

      - name: Build
        run: npm run build

      - name: Prepare test configuration
        run: cp apps/api/.env.test.example apps/api/.env.test

      - name: API tests
        run: npm test