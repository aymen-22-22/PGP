name: Deploy to shared host

# Zero-touch delivery for the shared-hosting deployment (docs/deployment.md
# §"cPanel / Plesk"). Fires automatically once CI is green on main, so a
# merge is genuinely the last manual step: no downloading an artifact zip,
# no uploading it, no running prisma generate on a host that cannot.
#
# Builds and generates the Prisma client on the runner — the host's thread
# cap is what build-artifacts.yml was written to work around (see its own
# header) — then ships the result over SSH and restarts. Prisma migrations
# are applied first, against Neon directly, the same way neon-migrate.yml
# does it manually; that workflow stays for ad-hoc use, this one folds the
# same step into the pipeline so nobody has to remember to run it.
#
# Required repository secrets:
#   NEON_DATABASE_URL — already used by neon-migrate.yml.
#   DEPLOY_SSH_HOST    — the host to SSH to (your domain or the server name
#                        cPanel's SSH Access page shows).
#   DEPLOY_SSH_PORT    — usually 22; cPanel sometimes assigns another port,
#                        shown on the same SSH Access page.
#   DEPLOY_SSH_USER    — your cPanel account username.
#   DEPLOY_SSH_KEY     — a private key whose matching public key is
#                        installed for that account (cPanel → SSH Access →
#                        Manage SSH Keys → Import Key, or appended to
#                        ~/.ssh/authorized_keys by hand). Generate a pair
#                        dedicated to this with:
#                          ssh-keygen -t ed25519 -f deploy_key
#                        and paste deploy_key's contents into this secret —
#                        never deploy_key.pub, which is the one that goes on
#                        the host.
#   DEPLOY_SSH_KEY_PASSPHRASE — the passphrase for that key. Some hosts
#                        (cPanel's "Manage SSH Keys" among them) refuse to
#                        import a key with no passphrase, so this pipeline
#                        assumes one exists and unlocks it non-interactively
#                        with SSH_ASKPASS. Leave the secret unset (or empty)
#                        if a future key genuinely has none.
#
# Optional repository variables (Settings → Variables → Actions).
# DEPLOY_APP_DIR and DEPLOY_WEB_ROOT accept a leading ~, expanded against the
# account's home directory:
#   DEPLOY_APP_DIR   — the application checkout on the host, default ~/PGP-erp
#   DEPLOY_WEB_ROOT  — the document root the web build is published to,
#                      default ~/pgp.etdledger.com
#   DEPLOY_PUBLIC_URL — the site's real public URL, default
#                      https://pgp.etdledger.com. Only used for the
#                      post-deploy health check — DEPLOY_SSH_HOST is an SSH
#                      endpoint (often a server hostname, not the domain
#                      visitors use) and is never assumed to also serve HTTP.

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-shared-host
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate -w @phone-erp/api

      - name: Apply pending migrations
        run: npm run db:deploy -w @phone-erp/api

      - name: Build
        run: npm run build

      # Natural relative paths, so the same tar can be extracted straight
      # into the application root on the host with no path rewriting.
      - name: Package the build
        run: tar czf /tmp/pgp-deploy-payload.tar.gz node_modules/.prisma apps/api/dist apps/web/dist packages/shared-types/dist

      # Not webfactory/ssh-agent: it has no way to supply a passphrase, and
      # cPanel's own "Manage SSH Keys" refuses to import a key without one.
      # SSH_ASKPASS_REQUIRE=force is what makes ssh-add use the askpass
      # script below instead of trying (and failing, for lack of a TTY) to
      # prompt interactively — it needs OpenSSH 8.4+, which every current
      # ubuntu-latest runner has.
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KEY_PASSPHRASE: ${{ secrets.DEPLOY_SSH_KEY_PASSPHRASE }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          eval "$(ssh-agent -s)"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"

          askpass="$RUNNER_TEMP/askpass.sh"
          printf '#!/bin/sh\necho "$SSH_KEY_PASSPHRASE"\n' > "$askpass"
          chmod 700 "$askpass"

          SSH_ASKPASS="$askpass" SSH_ASKPASS_REQUIRE=force setsid ssh-add ~/.ssh/deploy_key < /dev/null
          rm -f "$askpass"

      - name: Trust the host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ secrets.DEPLOY_SSH_PORT }}" "${{ secrets.DEPLOY_SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Ship and unpack
        env:
          SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          APP_DIR: ${{ vars.DEPLOY_APP_DIR || '~/PGP-erp' }}
          WEB_ROOT: ${{ vars.DEPLOY_WEB_ROOT || '~/pgp.etdledger.com' }}
        run: |
          DEST="$SSH_USER@$SSH_HOST"
          scp -P "$SSH_PORT" /tmp/pgp-deploy-payload.tar.gz "$DEST:/tmp/pgp-deploy-payload.tar.gz"
          scp -P "$SSH_PORT" scripts/deploy-remote.sh "$DEST:/tmp/pgp-deploy-remote.sh"
          ssh -p "$SSH_PORT" "$DEST" bash /tmp/pgp-deploy-remote.sh "$APP_DIR" "$WEB_ROOT"
          ssh -p "$SSH_PORT" "$DEST" rm -f /tmp/pgp-deploy-remote.sh

      - name: Verify the API answered
        env:
          PUBLIC_URL: ${{ vars.DEPLOY_PUBLIC_URL || 'https://pgp.etdledger.com' }}
        run: |
          sleep 5
          code="$(curl -s -o /dev/null -w '%{http_code}' "$PUBLIC_URL/api/v1/auth/me" || echo 000)"
          echo "$PUBLIC_URL/api/v1/auth/me responded $code"
          # 401 is success here: the API is up and correctly asking for a login.
          if [ "$code" != "401" ]; then
            echo "::warning::The API did not answer 401 after deploy (got $code from $PUBLIC_URL). If this URL is wrong for your setup, set the DEPLOY_PUBLIC_URL repository variable."
          fi
